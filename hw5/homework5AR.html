<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Solar System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: images/marker2.mind;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
      color-space="sRGB"
      renderer="colorManagement: true">

      <!-- Обов'язкова камера -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Цільовий маркер -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Масштабуємо всю систему, щоб вона вмістилася на маркері -->
        <a-entity position="0 0 0" scale="0.01 0.01 0.01">

          <!-- Сонце -->
          <a-sphere
            radius="4"
            src="planets/sun.jpg"
            position="0 0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear;">
          </a-sphere>

          <!-- ОРБІТА МЕРКУРІЯ -->
          <a-entity position="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 8800; easing: linear;">
            <a-sphere 
              position="14 0 0"
              radius="0.3"
              src="planets/mercury.jpg"
              animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear;">
            </a-sphere>
          </a-entity>

          <!-- ОРБІТА ВЕНЕРИ -->
          <a-entity position="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 22500; easing: linear;">
            <a-sphere 
              position="20 0 0"
              radius="0.4"
              src="planets/venus.jpg"
              animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear;">
            </a-sphere>
          </a-entity>

          <!-- ОРБІТА ЗЕМЛІ -->
          <a-entity position="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 36500; easing: linear;">
            <a-sphere 
              position="26 0 0"
              radius="0.45"
              src="planets/earth.jpg"
              animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear;">
            </a-sphere>
          </a-entity>

          <!-- ОРБІТА МАРСА -->
          <a-entity position="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 68700; easing: linear;">
            <a-sphere 
              position="34 0 0"
              radius="0.38"
              src="planets/mars.jpg"
              animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear;">
            </a-sphere>
          </a-entity>

          <!-- І так далі для інших планет, якщо хочете їх бачити в AR -->

        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
