<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Solar System</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: black">
      
      <a-sphere radius="4" src="./planets/sun.jpg" position="0 0 0" animation="..."></a-sphere>

      <a-entity position="0 0 0" animation="...">
        <a-sphere position="14 0 0" radius="0.3" src="./planets/mercury.jpg" animation="..."></a-sphere>
      </a-entity>

      <a-entity position="0 0 0" animation="...">
        <a-sphere position="20 0 0" radius="0.4" src="./planets/venus.jpg" animation="..."></a-sphere>
      </a-entity>

      <a-entity position="0 0 0" animation="...">
        <a-sphere position="26 0 0" radius="0.45" src="./planets/earth.jpg" animation="..."></a-sphere>
      </a-entity>
      
      <a-entity position="0 0 0" animation="...">
        <a-sphere position="34 0 0" radius="0.38" src="./planets/mars.jpg" animation="..."></a-sphere>
      </a-entity>

      <a-entity position="0 0 0" animation="...">
        <a-sphere position="53 0 0" radius="0.9" src="./planets/jupiter.jpg" animation="..."></a-sphere>
      </a-entity>

      <a-entity position="0 0 0" animation="...">
        <a-sphere position="74 0 0" radius="0.8" src="./planets/saturn.jpg" animation="..."></a-sphere>
      </a-entity>

      <a-entity position="0 0 0" animation="...">
        <a-sphere position="104 0 0" radius="0.7" src="./planets/uranus.jpg" animation="..."></a-sphere>
      </a-entity>

      <a-entity position="0 0 0" animation="...">
        <a-sphere position="159 0 0" radius="0.68" src="./planets/neptune.jpg" animation="..."></a-sphere>
      </a-entity>

      <a-entity id="cameraRig" position="0 5 30" wasd-controls look-controls><a-camera></a-camera></a-entity>
    </a-scene>
  </body>
</html>
